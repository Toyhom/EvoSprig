name: Desktop clients
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['apps/desktop/**', 'apps/studio/**', 'src/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[server,models,mcp,documents,artifacts,evolution]' pyinstaller==6.16.0 pytest==8.4.2
      - name: Check native locks and persistent service lifecycle
        run: python -m pytest tests/test_process_support.py tests/test_local_services.py -q
      - run: npm ci && npm run build
        working-directory: apps/studio
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: python apps/desktop/scripts/build_backend.py
      - name: Test the bundled Python runtime and standalone export
        run: npm test
        working-directory: apps/desktop
        env:
          EVOSPRIG_BACKEND_EXECUTABLE: ${{ github.workspace }}/apps/desktop/build/backend/evosprig-backend/evosprig-backend${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Package desktop installers
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: apps/desktop
      - name: Smoke-test the packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke
        working-directory: apps/desktop
        env:
          EVOSPRIG_DESKTOP_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/linux-unpacked/evosprig-desktop
          EVOSPRIG_ELECTRON_NO_SANDBOX: '1'
          DEBUG: 'pw:browser'
      - name: Smoke-test the packaged Windows application
        if: runner.os == 'Windows'
        run: npm run test:smoke
        working-directory: apps/desktop
        env:
          EVOSPRIG_DESKTOP_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/win-unpacked/EvoSprig Studio.exe
      - name: Smoke-test the packaged macOS application
        if: runner.os == 'macOS'
        run: npm run test:smoke
        working-directory: apps/desktop
        env:
          EVOSPRIG_DESKTOP_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/EvoSprig Studio.app/Contents/MacOS/EvoSprig Studio
      - uses: actions/upload-artifact@v4
        with:
          name: EvoSprig-Studio-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import json, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          for app in ('desktop', 'studio'):
              assert json.loads(Path(f'apps/{app}/package.json').read_text())['version'] == version
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          pattern: EvoSprig-Studio-*
          path: ${{ runner.temp }}/desktop-installers
          merge-multiple: true
      - name: Build source and Python distributions
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/release-assets"
          python scripts/release/package.py --out "$RUNNER_TEMP/release-assets"
          python scripts/release/audit.py --artifacts "$RUNNER_TEMP/release-assets"
          python - <<'PYCODE'
          import hashlib, os, shutil, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          source = Path(os.environ['RUNNER_TEMP']) / 'desktop-installers'
          output = source.parent / 'release-assets'
          targets = ('win-x64.exe', 'mac-arm64.dmg', 'mac-arm64.zip', 'mac-x64.dmg', 'mac-x64.zip', 'linux-x86_64.AppImage', 'linux-amd64.deb')
          for target in targets:
              path = source / f'EvoSprig-Studio-{version}-{target}'
              assert path.is_file() and path.stat().st_size > 1_000_000, path
              shutil.copy2(path, output / path.name)
          with (output / 'SHA256SUMS').open('w') as checksums:
              for path in sorted(output.iterdir()):
                  if path.is_file() and path.name != 'SHA256SUMS':
                      with path.open('rb') as stream:
                          checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
                      checksums.write(f'{checksum}  {path.name}\n')
          PYCODE
      - name: Attach verified installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* --clobber
