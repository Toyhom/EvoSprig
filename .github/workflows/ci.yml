name: Offline contracts
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests examples scripts apps/media-service apps/robot-service apps/episode-studio
      - run: pytest -q
      - run: python -m build
      - run: python scripts/release/audit.py --artifacts dist --git-history
      - run: |
          evosprig export examples/hello/agent.yaml --out "$RUNNER_TEMP/hello-export"
          python -m venv "$RUNNER_TEMP/export-venv"
          "$RUNNER_TEMP/export-venv/bin/pip" install -r "$RUNNER_TEMP/hello-export/requirements.lock"
          "$RUNNER_TEMP/export-venv/bin/pip" install --no-deps "$RUNNER_TEMP/hello-export"
          "$RUNNER_TEMP/export-venv/bin/python" "$RUNNER_TEMP/hello-export/app.py" --mock --input '{"question":"hello"}'
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps -e .
      - run: npm ci && npm run build && npx playwright install --with-deps chromium --only-shell
        working-directory: apps/studio
      - run: npm test
        working-directory: apps/studio
        env:
          EVOSPRIG_TEST_WORKSPACE: ${{ runner.temp }}/studio
  toolbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci && npx playwright install --with-deps chromium --only-shell
        working-directory: apps/toolbox
      - run: npm test
        working-directory: apps/toolbox
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: -r apps/robot-service/requirements.txt pytest==8.4.2
      - run: python -m pytest apps/robot-service/tests -q -c /dev/null
