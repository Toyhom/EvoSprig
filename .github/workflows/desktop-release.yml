name: Assemble desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      build_run:
        description: Successful native Desktop clients build run ID
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      build_run:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match source and tested native builds
        run: |
          python - <<'PY'
          import json, os, subprocess, tomllib
          from pathlib import Path
          source = Path('source')
          version = tomllib.loads((source / 'pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          for app in ('desktop', 'studio'):
              assert json.loads((source / f'apps/{app}/package.json').read_text())['version'] == version
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["RELEASE_REPO"]}/{path}']))
          run = api(f'actions/runs/{os.environ["BUILD_RUN"]}')
          head = subprocess.check_output(['git', '-C', 'source', 'rev-parse', 'HEAD'], text=True).strip()
          assert run['head_sha'] == head and run['name'] == 'Desktop clients'
          jobs = api(f'actions/runs/{os.environ["BUILD_RUN"]}/jobs')['jobs']
          builds = [job for job in jobs if job['name'].startswith('build (')]
          assert len(builds) == 4 and all(job['conclusion'] == 'success' for job in builds)
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          pattern: EvoSprig-Studio-*
          path: ${{ runner.temp }}/desktop-installers
          merge-multiple: true
      - name: Build source distributions and checksums
        run: |
          python -m pip install build==1.3.0
          python -m build source --outdir "$RUNNER_TEMP/release-assets"
          python release-tools/scripts/release/package.py --root source --out "$RUNNER_TEMP/release-assets"
          python release-tools/scripts/release/audit.py --root source --artifacts "$RUNNER_TEMP/release-assets"
          python - <<'PY'
          import hashlib, os, shutil, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('source/pyproject.toml').read_text())['project']['version']
          source = Path(os.environ['RUNNER_TEMP']) / 'desktop-installers'
          output = source.parent / 'release-assets'
          targets = ('win-x64.exe', 'mac-arm64.dmg', 'mac-arm64.zip', 'mac-x64.dmg', 'mac-x64.zip', 'linux-x86_64.AppImage', 'linux-amd64.deb')
          for target in targets:
              path = source / f'EvoSprig-Studio-{version}-{target}'
              assert path.is_file() and path.stat().st_size > 1_000_000, path
              shutil.copy2(path, output / path.name)
          with (output / 'SHA256SUMS').open('w') as checksums:
              for path in sorted(output.iterdir()):
                  if path.is_file() and path.name != 'SHA256SUMS':
                      with path.open('rb') as stream:
                          checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
                      checksums.write(f'{checksum}  {path.name}\n')
          PY
      - name: Upload to draft release
        run: |
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPO" "$RUNNER_TEMP"/release-assets/* --clobber
