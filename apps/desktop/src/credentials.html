<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>API keys</title><style>body{margin:0;padding:30px;color:#303744;background:#fff;font:14px/1.6 system-ui}h1{font-size:21px;font-weight:550;margin:0 0 8px}p{color:#777e89;font-size:12px}label{display:block;margin:18px 0;font-size:12px}input,button{box-sizing:border-box;font:inherit;border:1px solid #dfe1e6;border-radius:6px;padding:9px 12px}input{display:block;width:100%;margin-top:7px}button{cursor:pointer;background:#303744;color:white}button:hover{background:#4b566b}li{display:flex;align-items:center;justify-content:space-between;margin:8px 0}li button{padding:3px 8px;background:white;color:#707785}ul{list-style:none;padding:0}#message{color:#496b51}#storage{padding-top:10px;border-top:1px solid #eceef1}</style><h1 id="title">API keys</h1><p id="intro">Use the same variable name as the model connection in Studio.</p><form><label><span id="name-label">Environment variable</span><input id="name" placeholder="MODEL_API_KEY" required pattern="[A-Z][A-Z0-9_]*_(KEY|TOKEN)" autocomplete="off"></label><label><span id="value-label">API key</span><input id="value" type="password" required autocomplete="off"></label><button id="save" type="submit">Save key</button></form><p id="message" role="status"></p><ul id="names"></ul><p id="storage"></p><script src="credentials.js"></script></html>
