        prompt:
          default: null
          optional: false
          ref: nodes.frame_prompt.output.prompt
        shot:
          default: null
          optional: false
          ref: input.shot
        style:
          default: null
          optional: false
          ref: input.style
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        additionalProperties: false
        properties:
          id:
            minLength: 1
            type: string
          media_type:
            minLength: 1
            type: string
          uri:
            minLength: 1
            type: string
        required:
        - id
        - uri
