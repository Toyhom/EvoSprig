id: local-video-shot
input_schema:
  additionalProperties: false
  properties:
    catalog:
      additionalProperties: false
      properties:
        assets:
          items:
            additionalProperties: false
            properties:
              asset:
                additionalProperties: false
                properties:
                  id:
                    minLength: 1
                    type: string
                  media_type:
                    minLength: 1
                    type: string
                  uri:
                    minLength: 1
                    type: string
                required:
                - id
                - uri
                - media_type
                type: object
              character_id:
                minLength: 1
                type: string
            required:
            - character_id
            - asset
            type: object
          minItems: 1
          type: array
      required:
      - assets
      type: object
    shot:
      additionalProperties: false
      properties:
        camera:
          minLength: 1
          type: string
        characters:
          items:
            minLength: 1
            type: string
          type: array
        description:
          minLength: 1
          type: string
        dialogue:
          type: string
        duration_seconds:
          maximum: 20
          minimum: 1
          type: integer
        id:
          minLength: 1
          type: string
      required:
      - id
      - description
      - camera
      - dialogue
      - characters
      - duration_seconds
      type: object
    style:
      minLength: 1
      type: string
  required:
  - shot
  - catalog
  - style
  type: object
models:
  artist:
    binding: main
    requires:
    - text
    - structured_output
  reviewer:
    binding: vision
    requires:
    - text
    - structured_output
    - vision
output_schema:
  additionalProperties: false
  properties:
    clip:
      additionalProperties: false
      properties:
        id:
          minLength: 1
          type: string
        media_type:
          minLength: 1
          type: string
        uri:
          minLength: 1
          type: string
      required:
      - id
      - uri
      - media_type
      type: object
    first_frame:
      additionalProperties: false
      properties:
        id:
          minLength: 1
          type: string
        media_type:
          minLength: 1
          type: string
        uri:
          minLength: 1
          type: string
      required:
      - id
      - uri
      - media_type
      type: object
  required:
  - clip
  - first_frame
  type: object
resources:
  frame_review:
    path: prompts/frame-review.md
    role: prompt
  storyboard:
    path: prompts/storyboard.md
    role: prompt
spec_version: '0.3'
tools:
  image:
    plugin: media.image
    version: '1'
  video:
    plugin: media.video
    version: '1'
  vision:
    plugin: media.vision
    version: '1'
