      optional: false
      ref: nodes.manipulate.output.last_action
    result:
      default: null
      optional: false
      ref: nodes.check.output
id: rai-manipulation
input_schema:
  additionalProperties: false
  properties:
    goals:
      items:
        additionalProperties: false
        properties:
          kind:
            enum:
            - in_tray
            - 'on'
            - unchanged
          object:
            enum:
            - red
            - blue
            - yellow
          target:
            enum:
            - red
            - blue
            - yellow
        required:
        - object
        - kind
        - target
        type: object
      minItems: 1
      type: array
    request:
      minLength: 1
      type: string
  required:
  - request
  - goals
  type: object
models:
  controller:
    binding: vision
    requires:
    - vision
    - structured_output
    - text
output_schema:
  additionalProperties: false
  properties:
    episode:
      minLength: 1
      type: string
    last_action:
      type: object
    result:
      type: object
  required:
  - result
  - episode
  - last_action
  type: object
resources:
  controller:
    path: prompts/controller.md
    role: prompt
  manipulation:
    path: skills/manipulation.md
    role: skill
spec_version: '0.3'
tools:
  act:
    plugin: robot.act
    version: '1'
  check:
    plugin: robot.check
    version: '1'
  observe:
    plugin: robot.observe
    version: '1'
  start:
    plugin: robot.start
    version: '1'
