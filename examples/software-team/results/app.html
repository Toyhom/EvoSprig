<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Expense Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.125rem;
      line-height: 1.5;
      color: #1a1a1a;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      max-width: 640px;
      width: 100%;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 1.75rem 1.5rem 2rem;
      border: 1px solid #eaeaea;
    }
    h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.25rem; color: #0a0a0a; }
    .subhead { font-size: 1rem; color: #4a4a4a; margin-bottom: 1.75rem; border-bottom: 1px solid #eaeaea; padding-bottom: 1rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; font-size: 1rem; margin-bottom: 0.35rem; color: #1a1a1a; }
    .input-row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; }
    .input-row .form-group { flex: 1 1 140px; margin-bottom: 0; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 0.7rem 0.9rem; font-size: 1.125rem; font-family: inherit;
      border: 1.5px solid #b0b0b0; border-radius: 0.5rem; background: #ffffff; color: #1a1a1a;
      transition: border-color 0.15s, box-shadow 0.15s; appearance: none;
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; border-color: #1a5fb4; box-shadow: 0 0 0 3px rgba(26,95,180,0.15); }
    input[aria-invalid="true"] { border-color: #b00020; }
    button { font-family: inherit; font-size: 1.125rem; font-weight: 600; border: none; border-radius: 0.5rem; cursor: pointer; transition: background 0.15s, box-shadow 0.15s; line-height: 1.3; }
    .btn-add { background: #1a5fb4; color: #ffffff; padding: 0.7rem 1.6rem; white-space: nowrap; flex-shrink: 0; margin-top: 0.25rem; }
    .btn-add:hover { background: #134a8e; }
    .btn-add:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 3px; box-shadow: 0 0 0 5px rgba(26,95,180,0.25); }
    .btn-delete { background: #f0f0f0; color: #b00020; padding: 0.35rem 0.9rem; font-size: 0.95rem; font-weight: 600; border-radius: 0.4rem; border: 1px solid #d0d0d0; }
    .btn-delete:hover { background: #ffe5e5; border-color: #b00020; }
    .btn-delete:focus-visible { outline: 3px solid #b00020; outline-offset: 2px; box-shadow: 0 0 0 4px rgba(176,0,32,0.15); }
    .error-message { color: #b00020; font-size: 0.95rem; font-weight: 500; margin-top: 0.5rem; min-height: 1.5rem; display: flex; align-items: center; gap: 0.3rem; }
    .error-message::before { content: "⚠"; font-size: 1.1rem; }
    .error-message:empty::before { content: ""; }
    .hint { font-size: 0.9rem; color: #5a5a5a; margin-top: 0.4rem; }
    .list-section { margin-top: 2rem; border-top: 1px solid #eaeaea; padding-top: 1.5rem; }
    .list-header { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .list-header h2 { font-size: 1.25rem; font-weight: 600; color: #0a0a0a; }
    .total-display { font-size: 1.35rem; font-weight: 700; color: #0a0a0a; background: #f5f5f5; padding: 0.3rem 1rem; border-radius: 2rem; border: 1px solid #e0e0e0; white-space: nowrap; }
    .total-display span { font-weight: 800; color: #1a5fb4; }
    .expense-list { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    .expense-item { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; background: #fafafa; padding: 0.7rem 1rem; border-radius: 0.6rem; border: 1px solid #eaeaea; transition: background 0.1s; }
    .expense-item:hover { background: #f5f5f5; }
    .expense-info { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem; font-size: 1.05rem; min-width: 0; }
    .expense-amount { font-weight: 700; color: #0a0a0a; min-width: 5rem; }
    .expense-category { color: #3a3a3a; background: #eaeaea; padding: 0.15rem 0.7rem; border-radius: 1rem; font-size: 0.95rem; font-weight: 500; overflow-wrap: anywhere; }
    .empty-state { color: #6a6a6a; font-style: italic; padding: 1rem 0; text-align: center; font-size: 1rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 480px) {
      body { padding: 1rem 0.5rem; }
      .app { padding: 1.25rem 1rem 1.5rem; }
      .input-row { flex-direction: column; align-items: stretch; }
      .btn-add { width: 100%; margin-top: 0.5rem; }
      .expense-item { flex-wrap: wrap; }
      .expense-info { flex: 1 1 100%; }
      .btn-delete { margin-left: auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Expense Tracker</h1>
    <p class="subhead">Log your freelance expenses — offline, private, simple.</p>

    <form id="expense-form" novalidate>
      <div class="input-row">
        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="text" id="amount" name="amount" inputmode="decimal" placeholder="e.g. 49.99" autocomplete="off" aria-describedby="amount-error" />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <input type="text" id="category" name="category" placeholder="e.g. Software, Travel" autocomplete="off" aria-describedby="category-hint" />
        </div>
        <button type="submit" class="btn-add" id="add-btn">Add expense</button>
      </div>
      <div id="amount-error" class="error-message" role="alert" aria-live="polite"></div>
      <p id="category-hint" class="hint">Optional. If left blank, category will be "Uncategorized".</p>
    </form>

    <section class="list-section" aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading">Expenses</h2>
        <div class="total-display" aria-live="polite" aria-atomic="true">Total: <span id="total-amount">$0.00</span></div>
      </div>
      <ul id="expense-list" class="expense-list" aria-label="Expense entries"></ul>
      <p id="empty-message" class="empty-state">No expenses yet. Add one above.</p>
    </section>
  </main>

  <script>
    (function() {
      'use strict';
      let expenses = [];
      let nextId = 1;

      const form = document.getElementById('expense-form');
      const amountInput = document.getElementById('amount');
      const categoryInput = document.getElementById('category');
      const amountError = document.getElementById('amount-error');
      const expenseList = document.getElementById('expense-list');
      const totalAmountEl = document.getElementById('total-amount');
      const emptyMessage = document.getElementById('empty-message');

      function formatCurrency(value) { return '$' + value.toFixed(2); }

      function updateTotal() {
        const total = expenses.reduce((sum, exp) => sum + exp.amount, 0);
        totalAmountEl.textContent = formatCurrency(total);
      }

      function renderList() {
        expenseList.innerHTML = '';
        emptyMessage.style.display = expenses.length === 0 ? 'block' : 'none';

        expenses.forEach(exp => {
          const li = document.createElement('li');
          li.className = 'expense-item';
          li.dataset.id = exp.id;

          const infoDiv = document.createElement('div');
          infoDiv.className = 'expense-info';

          const amountSpan = document.createElement('span');
          amountSpan.className = 'expense-amount';
          amountSpan.textContent = formatCurrency(exp.amount);

          const categorySpan = document.createElement('span');
          categorySpan.className = 'expense-category';
          categorySpan.textContent = exp.category;

          infoDiv.appendChild(amountSpan);
          infoDiv.appendChild(categorySpan);

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'btn-delete';
          deleteBtn.textContent = 'Delete';
          deleteBtn.setAttribute('aria-label', 'Delete expense: ' + formatCurrency(exp.amount) + ' for ' + exp.category);
          deleteBtn.addEventListener('click', function() { handleDelete(exp.id); });

          li.appendChild(infoDiv);
          li.appendChild(deleteBtn);
          expenseList.appendChild(li);
        });

        updateTotal();
      }

      function validateAmount(rawValue) {
        const trimmed = rawValue.trim();
        if (trimmed === '') return { valid: false, message: 'Please enter an amount.' };
        const numericRegex = /^-?\d+(\.\d+)?$/;
        if (!numericRegex.test(trimmed)) return { valid: false, message: 'Amount must be a valid number (e.g. 49.99).' };
        const num = parseFloat(trimmed);
        if (!isFinite(num)) return { valid: false, message: 'Amount must be a finite number.' };
        if (num < 0) return { valid: false, message: 'Amount cannot be negative.' };
        return { valid: true, value: num };
      }

      function showError(message) {
        amountError.textContent = message;
        amountInput.setAttribute('aria-invalid', 'true');
        amountInput.focus();
      }

      function clearError() {
        amountError.textContent = '';
        amountInput.removeAttribute('aria-invalid');
      }

      function handleAdd(e) {
        e.preventDefault();
        clearError();
        const validation = validateAmount(amountInput.value);
        if (!validation.valid) {
          showError(validation.message);
          return;
        }
        let category = categoryInput.value.trim();
        if (category === '') category = 'Uncategorized';

        expenses.push({ id: nextId++, amount: validation.value, category: category });
        amountInput.value = '';
        categoryInput.value = '';
        renderList();
        amountInput.focus();
      }

      function handleDelete(id) {
        expenses = expenses.filter(exp => exp.id !== id);
        renderList();
        amountInput.focus();
      }

      function init() {
        renderList();
        form.addEventListener('submit', handleAdd);
        amountInput.addEventListener('input', clearError);
        amountInput.focus();
      }

      init();
    })();
  </script>
</body>
</html>
