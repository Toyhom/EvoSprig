spec_version: '0.3'
id: research-team
input_schema:
  type: object
  properties:
    question:
      type: string
      minLength: 1
  required:
  - question
  additionalProperties: false
output_schema:
  type: object
  properties:
    text:
      type: string
  required:
  - text
  additionalProperties: false
models:
  main:
    binding: main
    requires:
    - text
    - tool_calling
    - structured_output
tools:
  search:
    plugin: documents.search
resources:
  planner:
    path: prompts/planner.md
  researcher:
    path: prompts/researcher.md
  writer:
    path: prompts/writer.md
graph:
  entry: plan
  nodes:
    plan:
      type: model
      inputs:
        question:
          ref: input.question
      output_schema:
        type: object
        properties:
          tasks:
            type: array
            items:
              type: string
              minLength: 1
            minItems: 1
            maxItems: 6
        required:
        - tasks
        additionalProperties: false
      model: main
      instructions:
        resource: planner
      response_format: json
    research:
      type: map
      inputs:
        question:
          ref: input.question
      output_schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                text:
                  type: string
              required:
              - text
              additionalProperties: false
        required:
        - items
        additionalProperties: false
      body:
        entry: research
        nodes:
          research:
            type: agent
            inputs:
              task:
                ref: input.item
              question:
                ref: input.context.question
            output_schema:
              type: object
              properties:
                text:
                  type: string
              required:
              - text
              additionalProperties: false
            model: main
            instructions:
              resource: researcher
            tools:
            - search
            tool_errors: feedback
        output:
          text:
            ref: nodes.research.output.text
      items:
        ref: nodes.plan.output.tasks
      max_items: 6
    writer:
      type: model
      inputs:
        question:
          ref: input.question
        findings:
          ref: nodes.research.output.items
      output_schema:
        type: object
        properties:
          text:
            type: string
        required:
        - text
        additionalProperties: false
      model: main
      instructions:
        resource: writer
    editor:
      type: human
      inputs:
        draft:
          ref: nodes.writer.output.text
      output_schema:
        type: object
        properties:
          text:
            type: string
        required:
        - text
        additionalProperties: false
  edges:
  - source: plan
    target: research
  - source: research
    target: writer
  - source: writer
    target: editor
  output:
    text:
      ref: nodes.editor.output.text
execution:
  max_steps: 100
  max_model_calls: 32
  max_total_tokens: 80000
  max_output_tokens: 2000
  timeout_seconds: 300.0
  max_parallel_nodes: 3
  max_parallel_tools: 3
