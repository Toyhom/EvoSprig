id: evidence-and-tools-smoke
description: 'Nine authored smoke cases with disjoint inputs: 3 search, 2 selection,
  2 release, 2 sealed test. Exact answer strings plus required tool receipts. For
  integration evidence, not a general effectiveness estimate.'
metric:
  kind: exact
  output_path: answer
  normalize_text: true
search:
- id: search-qa-1
  input:
    question: Which color marks successful checks?
    evidence: The guide uses green for success and amber for a pending check.
  expected: green
  tags:
  - qa
  required_tools: []
- id: search-tool-1
  input:
    question: 'Use the addition tool to total the two measured counts: 14 and 9. Give
      the result as a number without units.'
    evidence: These are authored demonstration counts.
  expected: '23'
  tags:
  - tools
  required_tools:
  - add
- id: search-qa-2
  input:
    question: What identifier prevents an old worker from committing?
    evidence: The runtime records a counter named generation to reject writes from
      a superseded worker.
  expected: generation
  tags:
  - qa
  required_tools: []
selection:
- id: selection-qa
  input:
    question: Which transport is selected in this protocol recipe?
    evidence: The recipe selects Streamable HTTP for the tool connection.
  expected: streamable http
  tags:
  - qa
  required_tools: []
- id: selection-tool
  input:
    question: 'Use the addition tool to total the two measured counts: 17 and 8. Give
      the result as a number without units.'
    evidence: These are authored demonstration counts.
  expected: '25'
  tags:
  - tools
  required_tools:
  - add
release:
- id: release-qa
  input:
    question: What database stores local development checkpoints?
    evidence: Local checkpoints and operation receipts are stored in SQLite.
  expected: sqlite
  tags:
  - qa
  required_tools: []
- id: release-tool
  input:
    question: 'Use the addition tool to total the two measured counts: 23 and 19.
      Give the result as a number without units.'
    evidence: These are authored demonstration counts.
  expected: '42'
  tags:
  - tools
  required_tools:
  - add
test:
- id: test-qa
  input:
    question: What is the one-word label before ledger in the recovery evidence?
    evidence: Recovery applies the deletion ledger before exposing restored memory
      records.
  expected: deletion
  tags:
  - qa
  required_tools: []
- id: test-tool
  input:
    question: 'Use the addition tool to total the two measured counts: 31 and 16.
      Give the result as a number without units.'
    evidence: These are authored demonstration counts.
  expected: '47'
  tags:
  - tools
  required_tools:
  - add
