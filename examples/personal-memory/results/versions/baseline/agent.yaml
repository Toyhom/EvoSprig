execution:
  allow_side_effects: true
  max_model_calls: 10
  max_output_tokens: 1200
  max_parallel_nodes: 1
  max_parallel_tools: 1
  max_steps: 32
  max_total_tokens: 24000
  timeout_seconds: 180.0
graph:
  edges: []
  entry: assistant
  nodes:
    assistant:
      body: null
      branches: {}
      condition: null
      inputs:
        question:
          default: null
          optional: false
          ref: input.question
      instructions:
        resource: instructions
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      max_tool_rounds: 4
      model: main
      output_errors: feedback
      output_schema:
        additionalProperties: false
        properties:
          text:
            type: string
        required:
        - text
        type: object
      response_format: text
      tool: null
      tool_errors: feedback
      tools:
      - context
      - search
      - relations
      - remember
      - recall
      - summarize
      type: agent
      until: null
  output:
    text:
      default: null
      optional: false
      ref: nodes.assistant.output.text
id: personal-memory
input_schema:
  additionalProperties: false
  properties:
    question:
      minLength: 1
      type: string
  required:
  - question
  type: object
models:
  main:
    binding: main
    requires:
    - text
    - tool_calling
output_schema:
  additionalProperties: false
  properties:
    text:
      type: string
  required:
  - text
  type: object
resources:
  instructions:
    path: prompts/persona.md
    role: prompt
spec_version: '0.3'
tools:
  context:
    plugin: memory.context
    version: '1'
  recall:
    plugin: memory.recall
    version: '1'
  relations:
    plugin: memory.relations
    version: '1'
  remember:
    plugin: memory.write
    version: '1'
  search:
    plugin: memory.search
    version: '1'
  summarize:
    plugin: memory.summarize
    version: '1'
