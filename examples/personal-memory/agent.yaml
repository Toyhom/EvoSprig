spec_version: '0.3'
id: personal-memory
input_schema:
  type: object
  properties:
    question:
      type: string
      minLength: 1
  required:
  - question
  additionalProperties: false
output_schema:
  type: object
  properties:
    text:
      type: string
  required:
  - text
  additionalProperties: false
models:
  main:
    binding: main
    requires:
    - text
    - tool_calling
tools:
  search:
    plugin: memory.search
  remember:
    plugin: memory.write
  context:
    plugin: memory.context
  relations:
    plugin: memory.relations
resources:
  instructions:
    path: prompts/persona.md
graph:
  entry: assistant
  nodes:
    assistant:
      type: agent
      inputs:
        question:
          ref: input.question
      output_schema:
        type: object
        properties:
          text:
            type: string
        required:
        - text
        additionalProperties: false
      model: main
      instructions:
        resource: instructions
      tools:
      - context
      - search
      - relations
      - remember
      tool_errors: feedback
  output:
    text:
      ref: nodes.assistant.output.text
execution:
  max_model_calls: 10
  max_total_tokens: 24000
  max_output_tokens: 1200
  timeout_seconds: 180.0
  allow_side_effects: true
