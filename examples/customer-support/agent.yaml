execution:
  allow_side_effects: true
  max_model_calls: 3
  max_output_tokens: 1024
  max_parallel_nodes: 1
  max_parallel_tools: 1
  max_steps: 32
  max_total_tokens: 8192
  timeout_seconds: 60.0
graph:
  edges:
  - source: approval
    target: approved
    when: null
  - source: approved
    target: finish
    when: false
  - source: approved
    target: refund
    when: true
  - source: decision
    target: route
    when: null
  - source: lookup
    target: decision
    when: null
  - source: refund
    target: finish
    when: null
  - source: route
    target: approval
    when: true
  - source: route
    target: finish
    when: false
  entry: lookup
  nodes:
    approval:
      body: null
      branches: {}
      condition: null
      inputs:
        order:
          default: null
          optional: false
          ref: nodes.lookup.output
        proposal:
          default: null
          optional: false
          ref: nodes.decision.output
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        additionalProperties: false
        properties:
          approved:
            type: boolean
        required:
        - approved
        type: object
      response_format: text
      tool: null
      tool_errors: raise
      tools: []
      type: human
      until: null
    approved:
      body: null
      branches: {}
      condition:
        left:
          default: null
          optional: false
          ref: nodes.approval.output.approved
        op: truthy
        right: null
      inputs: {}
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        additionalProperties: false
        properties:
          value:
            type: boolean
        required:
        - value
        type: object
      response_format: text
      tool: null
      tool_errors: raise
      tools: []
      type: condition
      until: null
    decision:
      body: null
      branches: {}
      condition: null
      inputs:
        order:
          default: null
          optional: false
          ref: nodes.lookup.output
        question:
          default: null
          optional: false
          ref: input.question
      instructions:
        resource: policy
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: main
      output_errors: feedback
      output_schema:
        additionalProperties: false
        properties:
          amount:
            minimum: 0
            type: number
          refund:
            type: boolean
          reply:
            type: string
        required:
        - reply
        - refund
        - amount
        type: object
      response_format: json
      tool: null
      tool_errors: raise
      tools: []
      type: model
      until: null
    finish:
      body: null
      branches: {}
      condition: null
      inputs:
        receipt:
          default: null
          optional: true
          ref: nodes.refund.output
        reply:
          default: null
          optional: false
          ref: nodes.decision.output.reply
      instructions: ''
      items: null
      join: selected
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        additionalProperties: false
        properties:
          receipt:
            anyOf:
            - additionalProperties: false
              properties:
                amount:
                  type: number
                transaction_id:
                  type: string
              required:
              - transaction_id
              - amount
              type: object
            - type: 'null'
          reply:
            type: string
        required:
        - reply
        - receipt
        type: object
      response_format: text
      tool: null
      tool_errors: raise
      tools: []
      type: join
      until: null
    lookup:
      body: null
      branches: {}
      condition: null
      inputs:
        order_id:
          default: null
          optional: false
          ref: input.order_id
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        type: object
      response_format: text
      tool: lookup
      tool_errors: raise
      tools: []
      type: tool
      until: null
    refund:
      body: null
      branches: {}
      condition: null
      inputs:
        amount:
          default: null
          optional: false
          ref: nodes.decision.output.amount
        order_id:
          default: null
          optional: false
          ref: input.order_id
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        additionalProperties: false
        properties:
          amount:
            type: number
          transaction_id:
            type: string
        required:
        - transaction_id
        - amount
        type: object
      response_format: text
      tool: refund
      tool_errors: raise
      tools: []
      type: tool
      until: null
    route:
      body: null
      branches: {}
      condition:
        left:
          default: null
          optional: false
          ref: nodes.decision.output.refund
        op: truthy
        right: null
      inputs: {}
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        additionalProperties: false
        properties:
          value:
            type: boolean
        required:
        - value
        type: object
      response_format: text
      tool: null
      tool_errors: raise
      tools: []
      type: condition
      until: null
  output:
    receipt:
      default: null
      optional: false
      ref: nodes.finish.output.receipt
    reply:
      default: null
      optional: false
      ref: nodes.finish.output.reply
id: customer-support
input_schema:
  additionalProperties: false
  properties:
    order_id:
      type: string
    question:
      type: string
  required:
  - order_id
  - question
  type: object
models:
  main:
    binding: main
    requires:
    - text
    - structured_output
output_schema:
  additionalProperties: false
  properties:
    receipt:
      anyOf:
      - additionalProperties: false
        properties:
          amount:
            type: number
          transaction_id:
            type: string
        required:
        - transaction_id
        - amount
        type: object
      - type: 'null'
    reply:
      type: string
  required:
  - reply
  - receipt
  type: object
resources:
  policy:
    path: prompts/policy.md
    role: prompt
spec_version: '0.3'
tools:
  lookup:
    plugin: support.lookup
    version: '1'
  refund:
    plugin: support.refund
    version: '1'
