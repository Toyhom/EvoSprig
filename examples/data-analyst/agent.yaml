spec_version: '0.3'
id: data-analyst
input_schema:
  type: object
  properties:
    question:
      type: string
      minLength: 1
  required:
  - question
  additionalProperties: false
output_schema:
  type: object
  properties:
    text:
      type: string
  required:
  - text
  additionalProperties: false
models:
  main:
    binding: main
    requires:
    - text
    - tool_calling
tools:
  schema:
    plugin: database.schema
  query:
    plugin: database.query
resources:
  instructions:
    path: prompts/analyst.md
graph:
  entry: analyst
  nodes:
    analyst:
      type: agent
      inputs:
        question:
          ref: input.question
      output_schema:
        type: object
        properties:
          text:
            type: string
        required:
        - text
        additionalProperties: false
      model: main
      instructions:
        resource: instructions
      tools:
      - schema
      - query
      tool_errors: feedback
  output:
    text:
      ref: nodes.analyst.output.text
execution:
  max_steps: 40
  max_model_calls: 12
  max_total_tokens: 24000
  max_output_tokens: 1800
  timeout_seconds: 180.0
