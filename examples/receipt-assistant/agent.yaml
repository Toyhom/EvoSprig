execution:
  allow_side_effects: false
  max_model_calls: 32
  max_output_tokens: 4096
  max_parallel_nodes: 3
  max_parallel_tools: 3
  max_steps: 100
  max_total_tokens: 180000
  timeout_seconds: 300.0
graph:
  edges:
  - source: extract
    target: review
    when: null
  - source: scan
    target: extract
    when: null
  entry: scan
  nodes:
    extract:
      body: null
      branches: {}
      condition: null
      inputs:
        ocr:
          default: null
          optional: false
          ref: nodes.scan.output
      instructions:
        resource: extract
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      max_output_retries: 2
      model: main
      output_errors: feedback
      output_schema:
        additionalProperties: false
        properties:
          currency:
            type: string
          date:
            type: string
          items:
            items:
              additionalProperties: false
              properties:
                amount:
                  type: number
                name:
                  type: string
              required:
              - name
              - amount
              type: object
            type: array
          merchant:
            type: string
          subtotal:
            type:
            - number
            - 'null'
          tax:
            type:
            - number
            - 'null'
          total:
            type:
            - number
            - 'null'
        required:
        - merchant
        - date
        - currency
        - items
        - subtotal
        - tax
        - total
        type: object
      response_format: json
      tool: null
      tool_errors: raise
      tools: []
      type: model
      until: null
    review:
      body: null
      branches: {}
      condition: null
      inputs:
        ocr:
          default: null
          optional: false
          ref: nodes.scan.output
        policy:
          default: null
          optional: false
          ref: input.policy
        receipt:
          default: null
          optional: false
          ref: nodes.extract.output
      instructions:
        resource: review
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      max_output_retries: 2
      max_tool_rounds: 4
      model: main
      output_errors: feedback
      output_schema:
        properties:
          text:
            type: string
        required:
        - text
        type: object
      parallel_tool_calls: true
      response_format: text
      tool: null
      tool_errors: feedback
      tools:
      - python
      type: agent
      until: null
    scan:
      body: null
      branches: {}
      condition: null
      inputs:
        image_base64:
          default: null
          optional: false
          ref: input.image_base64
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        type: object
      response_format: text
      tool: ocr
      tool_errors: raise
      tools: []
      type: tool
      until: null
  output:
    receipt:
      default: null
      optional: false
      ref: nodes.extract.output
    review:
      default: null
      optional: false
      ref: nodes.review.output.text
id: receipt-assistant
input_schema:
  additionalProperties: false
  properties:
    image_base64:
      type: string
    policy:
      type: string
  required:
  - image_base64
  - policy
  type: object
models:
  main:
    binding: main
    requires:
    - text
    - tool_calling
    - structured_output
output_schema:
  additionalProperties: false
  properties:
    receipt:
      additionalProperties: false
      properties:
        currency:
          type: string
        date:
          type: string
        items:
          items:
            additionalProperties: false
            properties:
              amount:
                type: number
              name:
                type: string
            required:
            - name
            - amount
            type: object
          type: array
        merchant:
          type: string
        subtotal:
          type:
          - number
          - 'null'
        tax:
          type:
          - number
          - 'null'
        total:
          type:
          - number
          - 'null'
      required:
      - merchant
      - date
      - currency
      - items
      - subtotal
      - tax
      - total
      type: object
    review:
      type: string
  required:
  - receipt
  - review
  type: object
resources:
  extract:
    path: prompts/extract.md
    role: prompt
  review:
    path: prompts/review.md
    role: prompt
spec_version: '0.3'
tools:
  ocr:
    plugin: toolbox.ocr
    version: '1'
  python:
    plugin: toolbox.python
    version: '1'
