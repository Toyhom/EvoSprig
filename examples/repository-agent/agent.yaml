id: repository-agent
input_schema:
  additionalProperties: false
  properties:
    check:
      minLength: 1
      type: string
    request:
      type: string
  required:
  - request
  - check
  type: object
models:
  main:
    binding: main
    requires:
    - text
    - tool_calling
    - structured_output
output_schema:
  additionalProperties: false
  properties:
    decision:
      type: object
    proposal:
      type: object
  required:
  - proposal
  - decision
  type: object
resources:
  engineer:
    path: prompts/engineer.md
