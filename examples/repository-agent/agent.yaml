  repository:
    path: skills/repository.md
    role: skill
  reviewer:
    path: prompts/reviewer.md
    role: prompt
  triage:
    path: prompts/triage.md
    role: prompt
  verdict:
    path: code/verdict.py
    role: code
spec_version: '0.3'
tools:
  check:
    plugin: repository.check
    version: '1'
  diff:
    plugin: repository.diff
    version: '1'
  document_read:
    plugin: workspace.read
    version: '1'
  document_write:
    plugin: workspace.write
    version: '1'
  list:
