id: trade-followup
input_schema:
  additionalProperties: false
  properties:
    conversation:
      type: string
    customer_id:
      pattern: ^[A-Za-z0-9_-]{1,64}$
      type: string
    goal:
      type: string
    language:
      type: string
    product_facts:
      items:
        additionalProperties: false
        properties:
          id:
            type: string
          text:
            type: string
        required:
        - id
        - text
        type: object
      maxItems: 30
      minItems: 1
      type: array
    thread_id:
      pattern: ^[A-Za-z0-9_-]{1,64}$
      type: string
  required:
  - customer_id
  - thread_id
  - product_facts
  - conversation
  - language
  - goal
  type: object
models:
  main:
    binding: main
    requires:
    - text
    - structured_output
output_schema:
  type: object
resources:
  checks:
    path: code/checks.py
    role: code
  draft:
    path: prompts/draft.md
    role: prompt
  facts_valid:
    path: code/facts_valid.py
    role: code
  key:
    path: code/key.py
    role: code
  record:
    path: code/record.py
    role: code
  review:
    path: prompts/review.md
    role: prompt
  sales:
    path: skills/sales.md
    role: skill
spec_version: '0.3'
tools:
  python:
    plugin: code.python
    version: '1'
  read:
    plugin: workspace.read
    version: '1'
  write:
    plugin: workspace.write
    version: '1'
