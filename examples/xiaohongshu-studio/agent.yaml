id: xiaohongshu-studio
input_schema:
  additionalProperties: false
  properties:
    audience:
      maxLength: 500
      type: string
    emoji:
      enum:
      - none
      - light
      - lively
    goal:
      maxLength: 500
      type: string
    links:
      items:
        maxLength: 300
        pattern: ^https?://[^\s]+$
        type: string
      maxItems: 3
      type: array
    max_body_chars:
      maximum: 1500
      minimum: 100
      type: integer
    max_title_chars:
      maximum: 60
      minimum: 10
      type: integer
    references:
      items:
        maxLength: 2000
        type: string
      maxItems: 3
      type: array
    required_terms:
      items:
        type: string
      maxItems: 12
      type: array
    source:
      maxLength: 12000
      minLength: 1
      type: string
    voice:
      enum:
      - observer
      - brand
      - personal
  required:
  - source
  type: object
models:
  main:
    binding: main
    requires:
    - text
    - structured_output
output_schema:
  additionalProperties: false
  properties:
    changes:
      type: array
    feedback:
      items:
        type: string
      maxItems: 12
      type: array
    post:
      additionalProperties: false
      properties:
        body:
          minLength: 1
          type: string
        tags:
          items:
            minLength: 1
            type: string
          maxItems: 8
          minItems: 1
          type: array
        title:
          minLength: 1
          type: string
      required:
      - title
      - body
      - tags
      type: object
    ready:
      type: boolean
    rounds:
      type: integer
    text:
      type: string
  required:
  - text
  - post
  - ready
  - feedback
  - rounds
  - changes
  type: object
resources:
  brief:
    path: prompts/brief.md
    role: prompt
  check:
    path: code/check.py
    role: code
  draft:
    path: prompts/draft.md
    role: prompt
  examples:
    path: skills/examples.md
    role: skill
  format:
    path: code/format.py
    role: code
  prepare:
    path: code/prepare.py
    role: code
  remember:
    path: code/remember.py
    role: code
  review:
    path: prompts/review.md
    role: prompt
  source_fidelity:
    path: skills/source_fidelity.md
    role: skill
  voice:
    path: skills/voice.md
    role: skill
spec_version: '0.3'
tools:
  python:
    plugin: code.python
    version: '1'
