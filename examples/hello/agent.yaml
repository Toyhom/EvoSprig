spec_version: '0.1'
id: hello
input_schema:
  type: object
  properties:
    question: {type: string}
  required: [question]
  additionalProperties: false
output_schema:
  type: object
  properties:
    answer: {type: string}
  required: [answer]
  additionalProperties: false
models:
  main:
    binding: main-model
    requires: [text]
tools:
  stats:
    plugin: builtin.text_stats
    version: '1'
resources:
  instructions:
    path: prompts/assistant.md
    role: prompt
graph:
  entry: measure
  nodes:
    measure:
      type: tool
      tool: stats
      inputs:
        text: {ref: input.question}
      output_schema:
        type: object
        properties:
          characters: {type: integer}
          words: {type: integer}
        required: [characters, words]
        additionalProperties: false
    assistant:
      type: model
      model: main
      instructions: {resource: instructions}
      inputs:
        question: {ref: input.question}
        word_count: {ref: nodes.measure.output.words}
      output_schema:
        type: object
        properties:
          text: {type: string}
        required: [text]
        additionalProperties: false
  edges:
    - {source: measure, target: assistant}
  output:
    answer: {ref: nodes.assistant.output.text}
execution:
  max_steps: 12
  max_model_calls: 2
  max_total_tokens: 4096
  max_output_tokens: 256
  timeout_seconds: 60.0
