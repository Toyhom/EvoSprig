execution:
  allow_side_effects: true
  max_model_calls: 200
  max_output_tokens: 2048
  max_parallel_nodes: 1
  max_parallel_tools: 1
  max_steps: 600
  max_total_tokens: 1000000
  timeout_seconds: 1800.0
graph:
  edges:
  - source: read_procedure
    target: specialist
    when: null
  entry: read_procedure
  nodes:
    read_procedure:
      body: null
      branches: {}
      condition: null
      inputs: {}
      instructions: ''
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      model: null
      output_schema:
        type: object
      response_format: text
      tool: materials
      tool_errors: raise
      tools: []
      type: tool
      until: null
    specialist:
      body: null
      branches: {}
      condition: null
      inputs:
        case_id:
          default: null
          optional: false
          ref: input.case_id
        materials:
          default: null
          optional: false
          ref: nodes.read_procedure.output
      instructions:
        resource: procedure
      items: null
      join: all
      max_items: 32
      max_iterations: 1
      max_tool_rounds: 192
      model: main
      output_schema:
        properties:
          text:
            type: string
        required:
        - text
        type: object
      response_format: text
      tool: null
      tool_errors: feedback
      tools:
      - search
      - invoke
      type: agent
      until: null
  output:
    text:
      default: null
      optional: false
      ref: nodes.specialist.output.text
id: industry-assistant
input_schema:
  properties:
    case_id:
      type: string
  required:
  - case_id
  type: object
models:
  main:
    binding: main-model
    requires:
    - text
    - tool_calling
output_schema:
  properties:
    text:
      type: string
  required:
  - text
  type: object
resources:
  procedure:
    path: prompts/procedure.md
    role: prompt
spec_version: '0.3'
tools:
  invoke:
    plugin: industry.invoke
    version: '1'
  materials:
    plugin: industry.materials
    version: '1'
  search:
    plugin: industry.search
    version: '1'
