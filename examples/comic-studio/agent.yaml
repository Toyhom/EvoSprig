    path: prompts/adapter.md
    role: prompt
  continuity:
    path: skills/continuity.md
    role: skill
  frame_carry:
    path: code/frame_carry.py
    role: code
  frame_context:
    path: code/frame_context.py
    role: code
  frame_director:
    path: prompts/frame_director.md
    role: prompt
  frame_review:
    path: prompts/frame_review.md
    role: prompt
  panel:
    path: code/panel.py
    role: code
spec_version: '0.3'
tools:
  assets:
