[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "evosprig"
version = "0.1.2"
description = "Build self-evolving agents with workflows, memory, tools and controlled prompt and skill optimization."
keywords = ["agents", "self-evolving", "self-improvement", "rsi", "multi-agent", "prompt-optimization"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "EvoSprig contributors"}]
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.3", "jsonschema==4.25.1", "PyYAML==6.0.3"]

[project.urls]
Repository = "https://github.com/Toyhom/EvoSprig"
Issues = "https://github.com/Toyhom/EvoSprig/issues"
Documentation = "https://github.com/Toyhom/EvoSprig/tree/main/docs"

[project.optional-dependencies]
models = ["httpx==0.28.1"]
mcp = ["mcp==1.30.0"]
media = ["Pillow==12.0.0", "imageio-ffmpeg==0.6.0"]
evolution = ["gepa==0.1.4"]
server = ["httpx==0.28.1", "fastapi==0.121.0", "uvicorn==0.38.0"]
dev = ["gepa==0.1.4", "mcp==1.30.0", "httpx==0.28.1", "fastapi==0.121.0", "uvicorn==0.38.0", "pytest==8.4.2", "pytest-asyncio==1.2.0", "build==1.3.0", "ruff==0.14.3"]

[project.scripts]
evosprig = "evosprig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evosprig"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/spec", "/docs", "/scripts", "/README.md", "/README.zh-CN.md", "/pyproject.toml", "/requirements*.lock", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/apps", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
