<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · 客户工作台</title><style>
*{box-sizing:border-box}body{margin:0;color:#26313d;background:#f6f7f9;font:16px/1.75 system-ui,sans-serif}main{max-width:1180px;margin:45px auto;padding:0 25px}h1{font-size:30px;margin:0}header{margin-bottom:30px}small{color:#75808d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}section{padding:26px;background:white;border:1px solid #e0e4e9;border-radius:12px;min-width:0}h2{font-size:20px;margin:0 0 20px}button,input,textarea{font:inherit}button{background:#27384a;color:white;border:0;border-radius:7px;padding:9px 18px;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #cbd2da;border-radius:7px;margin:10px 0}article{border-bottom:1px solid #edf0f3;padding:16px 0}article small{display:block}article button{background:#f2f4f6;color:#535e6c;float:right;padding:3px 10px}pre{white-space:pre-wrap;font:inherit;overflow-wrap:anywhere}.status{color:#536477;min-height:28px}footer{color:#808a94;font-size:13px;margin-top:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style><main><header><h1>知识库 · 客户工作台</h1><small>更新资料，继续提问。智能体已独立部署。</small></header><div class="grid"><section><h2>业务资料</h2><input id="files" type="file" multiple aria-label="上传资料"><p id="upload-status" class="status"></p><div id="sources"></div></section><section><h2>向智能体提问</h2><form id="ask"><label for="question">你的问题</label><textarea id="question" required>电池保修期多久？申请需要什么材料？</textarea><button id="submit">提问</button></form><p id="run-status" class="status"></p><pre id="answer"></pre></section></div><footer>课堂附带的客户页面，连接 EvoSprig 导出的 HTTP 后端。生产部署可接入自己的身份与权限系统。</footer></main><script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));async function api(path,options={}){const r=await fetch('/api'+path,options),v=await r.json();if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v;}
async function refresh(){const docs=await api('/documents');$('sources').replaceChildren();for(const d of docs){const item=document.createElement('article'),title=document.createElement('strong'),source=document.createElement('small'),button=document.createElement('button');title.textContent=d.title;source.textContent=d.source+' · '+d.chunks+' 个分块';button.textContent='删除';button.onclick=async()=>{await api('/documents/'+d.id,{method:'DELETE'});await refresh();};item.append(button,title,source);$('sources').append(item);}}
$('files').onchange=async()=>{try{for(const file of $('files').files){$('upload-status').textContent='正在导入 '+file.name;const job=await api('/documents/upload?filename='+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});let state;do{await sleep(400);state=await api('/documents/jobs/'+job.id);}while(['queued','uploading','processing'].includes(state.status));if(state.status!=='succeeded')throw Error(state.error);}$('upload-status').textContent='资料已更新';await refresh();}catch(e){$('upload-status').textContent=e.message;}finally{$('files').value='';}};
$('ask').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('answer').textContent='';$('run-status').textContent='检索与回答中…';try{const job=await api('/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:{question:$('question').value}})});window.lastRunId=job.run_id;let run;do{await sleep(600);run=await api('/runs/'+job.run_id);}while(['queued','running','waiting_external'].includes(run.status));if(run.status!=='succeeded')throw Error(JSON.stringify(run.error||run.status));$('answer').textContent=run.output.text;$('run-status').textContent='回答完成';}catch(e){$('run-status').textContent=e.message;}finally{$('submit').disabled=false;}};refresh().catch(e=>$('upload-status').textContent=e.message);
</script></html>
